name: Déployer le site NACRÉ

# Publie le contenu de site/ sur GitHub Pages.
#
# Trois étapes :
#   1. deploy   — flux GitHub Pages moderne (artefact + deploy-pages) ;
#   2. fallback — si le flux moderne échoue (typiquement parce que Pages n'a
#      jamais été activé sur le dépôt), le site est poussé sur la branche
#      `gh-pages`, prête à être servie ;
#   3. verify   — interroge l'API Pages puis le site en ligne et écrit un
#      compte rendu clair dans le résumé du run.
#
# NOTE : la toute première activation de GitHub Pages ne peut pas être faite
# par GITHUB_TOKEN (l'endpoint exige un droit « admin » que le jeton d'Actions
# n'a pas). Elle se fait une seule fois, à la main :
#   Settings → Pages → Source : « Deploy from a branch » → gh-pages / (root)
# Une fois Pages actif, ce workflow republie tout seul à chaque push.

on:
  push:
    branches:
      - claude/nacre-landing-site-ycf8gc
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- 1
  deploy:
    name: Déploiement GitHub Pages
    runs-on: ubuntu-latest
    outputs:
      deployed: ${{ steps.result.outputs.deployed }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la présence du site
        run: |
          set -euo pipefail
          for f in site/index.html site/robots.txt site/sitemap.xml site/.nojekyll; do
            test -f "$f" || { echo "Fichier manquant : $f"; exit 1; }
          done
          grep -q 'Ajouter au panier' site/index.html
          test "$(grep -c 'class="product"' site/index.html)" -ge 4
          echo "Contrôle du contenu : OK ($(find site -type f | wc -l) fichiers)"

      - name: Configurer Pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Téléverser l'artefact
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publier
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Résultat
        id: result
        run: |
          if [ "${{ steps.deployment.outcome }}" = "success" ]; then
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          else
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "Flux moderne indisponible — bascule sur la branche gh-pages."
          fi

  # ---------------------------------------------------------------- 2
  fallback:
    name: Repli — publication sur gh-pages
    needs: deploy
    if: needs.deploy.outputs.deployed != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pousser le site sur gh-pages
        run: |
          set -euo pipefail
          rm -rf /tmp/pub && mkdir -p /tmp/pub
          cp -r site/. /tmp/pub/
          touch /tmp/pub/.nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
          fi

          git rm -rf . >/dev/null 2>&1 || true
          cp -r /tmp/pub/. .
          git add -A
          if git diff --cached --quiet; then
            echo "gh-pages est déjà à jour."
          else
            git commit -m "Publication du site NACRÉ ($GITHUB_SHA)"
            git push origin gh-pages
          fi

      - name: Tenter d'activer Pages sur la branche
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          BODY='{"source":{"branch":"gh-pages","path":"/"},"build_type":"legacy"}'
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST "$API" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" -d "$BODY")
          echo "POST /pages -> $code"; cat /tmp/out.json || true
          if [ "$code" = "409" ] || [ "$code" = "422" ]; then
            code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X PUT "$API" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" -d "$BODY")
            echo "PUT /pages -> $code"; cat /tmp/out.json || true
          fi
          if [ "$code" = "403" ]; then
            echo "Attendu : GITHUB_TOKEN n'a pas le droit d'activer Pages."
          fi

  # ---------------------------------------------------------------- 3
  verify:
    name: Vérification du site en ligne
    needs: [deploy, fallback]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Interroger l'API Pages puis le site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' "$API" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json")

          if [ "$code" != "200" ]; then
            {
              echo "### ⚠️ GitHub Pages n'est pas encore activé"
              echo
              echo "Le site est prêt et poussé sur la branche **gh-pages**, mais Pages"
              echo "doit être activé une seule fois à la main (le jeton d'Actions n'a"
              echo "pas ce droit) :"
              echo
              echo "1. ouvrir **Settings → Pages** du dépôt ;"
              echo "2. *Source* : **Deploy from a branch** ;"
              echo "3. *Branch* : \`gh-pages\` — dossier \`/ (root)\` — **Save**."
              echo
              echo "Le site sera alors servi sur <https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/>"
              echo "et ce workflow le republiera automatiquement à chaque push."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Pages non activé (GET /pages -> $code) — rien à vérifier."
            exit 0
          fi

          URL=$(python3 -c "import json;print(json.load(open('/tmp/pages.json'))['html_url'])")
          echo "URL publique : $URL"

          # laisser à GitHub le temps de construire
          for i in $(seq 1 30); do
            http=$(curl -sSL -o /tmp/live.html -w '%{http_code}' "$URL" || echo 000)
            echo "[$i] $URL -> $http"
            [ "$http" = "200" ] && break
            sleep 10
          done

          fail=0
          check() { if grep -q "$1" /tmp/live.html; then echo "  ✓ $2"; else echo "  ✗ $2"; fail=1; fi; }

          echo "Contrôles du HTML servi :"
          check "<title>NACRÉ" "titre de page"
          check "Ajouter au panier" "boutons d'ajout au panier"
          check "Huile Cheveux Réparatrice" "fiche produit 1"
          check "Recourbe-Cils Précision" "fiche produit 4"
          check "application/ld+json" "données structurées"

          for path in robots.txt sitemap.xml assets/js/app.js assets/css/styles.css; do
            http=$(curl -sSL -o /dev/null -w '%{http_code}' "${URL%/}/$path")
            if [ "$http" = "200" ]; then echo "  ✓ $path"; else echo "  ✗ $path ($http)"; fail=1; fi
          done

          {
            echo "### Site en ligne"
            echo
            echo "<$URL>"
          } >> "$GITHUB_STEP_SUMMARY"

          exit $fail
