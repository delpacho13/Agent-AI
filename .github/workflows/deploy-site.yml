name: Déployer le site NACRÉ

# Publie le contenu de site/ sur GitHub Pages.
#
# Deux chemins sont prévus :
#   1. le flux GitHub Pages moderne (artefact + deploy-pages) ;
#   2. si l'environnement github-pages refuse un déploiement depuis cette
#      branche, un repli automatique qui bascule Pages sur une source de
#      type branche et pousse le site sur `gh-pages`.
# Le second ne s'exécute que si le premier échoue.

on:
  push:
    branches:
      - claude/nacre-landing-site-ycf8gc
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- 1
  deploy:
    name: Déploiement GitHub Pages
    runs-on: ubuntu-latest
    outputs:
      deployed: ${{ steps.result.outputs.deployed }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la présence du site
        run: |
          test -f site/index.html
          test -f site/robots.txt
          test -f site/sitemap.xml
          echo "Contenu à publier :"
          find site -type f | sort

      - name: Configurer Pages
        id: configure
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Téléverser l'artefact
        id: upload
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publier
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Résultat
        id: result
        run: |
          if [ "${{ steps.deployment.outcome }}" = "success" ]; then
            echo "deployed=true" >> "$GITHUB_OUTPUT"
            echo "Site publié : ${{ steps.deployment.outputs.page_url }}"
          else
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "Le flux moderne a échoué — bascule sur le repli branche."
          fi

  # ---------------------------------------------------------------- 2
  fallback:
    name: Repli — publication depuis la branche gh-pages
    needs: deploy
    if: needs.deploy.outputs.deployed != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Préparer la branche gh-pages
        run: |
          set -euo pipefail
          rm -rf /tmp/pub && mkdir -p /tmp/pub
          cp -r site/. /tmp/pub/
          touch /tmp/pub/.nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
          fi

          git rm -rf . >/dev/null 2>&1 || true
          cp -r /tmp/pub/. .
          git add -A
          if git diff --cached --quiet; then
            echo "Aucun changement à publier."
          else
            git commit -m "Publication du site NACRÉ ($GITHUB_SHA)"
            git push origin gh-pages
          fi

      - name: Basculer Pages sur la source branche
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          BODY='{"source":{"branch":"gh-pages","path":"/"},"build_type":"legacy"}'

          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST "$API" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$BODY")
          echo "POST /pages -> $code"; cat /tmp/out.json || true

          if [ "$code" = "409" ] || [ "$code" = "422" ]; then
            code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X PUT "$API" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -d "$BODY")
            echo "PUT /pages -> $code"; cat /tmp/out.json || true
          fi

          curl -sS "$API" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" | tee /tmp/pages.json
          echo
          echo "URL publique : $(python3 -c "import json;print(json.load(open('/tmp/pages.json')).get('html_url','(inconnue)'))")"
