<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img">
<defs>
  <linearGradient id="m-bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1b1917"/><stop offset="1" stop-color="#0e0d0c"/>
  </linearGradient>
  <radialGradient id="m-glow" cx="50%" cy="34%" r="62%">
    <stop offset="0" stop-color="#c9a876" stop-opacity="0.22"/>
    <stop offset="0.55" stop-color="#c9a876" stop-opacity="0.05"/>
    <stop offset="1" stop-color="#c9a876" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="m-floor" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#000" stop-opacity="0.62"/>
    <stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="m-gold" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6d5836"/><stop offset="0.18" stop-color="#c9a876"/>
    <stop offset="0.42" stop-color="#f0dcb8"/><stop offset="0.66" stop-color="#c9a876"/>
    <stop offset="1" stop-color="#7a6440"/>
  </linearGradient>
  <linearGradient id="m-steel" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4a4a4d"/><stop offset="0.2" stop-color="#b9bcc2"/>
    <stop offset="0.45" stop-color="#eef1f5"/><stop offset="0.7" stop-color="#9a9ea6"/>
    <stop offset="1" stop-color="#4d4d51"/>
  </linearGradient>
</defs>
<rect width="900" height="1200" fill="url(#m-bg)"/>
<rect width="900" height="1200" fill="url(#m-glow)"/>

<defs>
  <linearGradient id="m-tube" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0a0a0a"/><stop offset="0.16" stop-color="#2c2c2e"/>
    <stop offset="0.4" stop-color="#4f4f52"/><stop offset="0.58" stop-color="#28282a"/>
    <stop offset="0.84" stop-color="#131314"/><stop offset="1" stop-color="#050505"/>
  </linearGradient>
</defs>
<ellipse cx="450" cy="1040" rx="230" ry="30" fill="url(#m-floor)"/>

<!-- tube -->
<rect x="368" y="330" width="164" height="678" rx="24" fill="url(#m-tube)"/>
<rect x="368" y="330" width="164" height="200" rx="24" fill="url(#m-gold)"/>
<rect x="368" y="506" width="164" height="7" fill="#0b0b0b" fill-opacity="0.55"/>
