<path d="M330 452 h240 a26 26 0 0 1 26 26 v498 a30 30 0 0 1 -30 30 h-232 a30 30 0 0 1 -30 -30 v-498 a26 26 0 0 1 26 -26 z" fill="url(#o-glass)"/>
