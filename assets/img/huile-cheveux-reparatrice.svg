<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img">
<defs>
  <linearGradient id="o-bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1b1917"/><stop offset="1" stop-color="#0e0d0c"/>
  </linearGradient>
  <radialGradient id="o-glow" cx="50%" cy="34%" r="62%">
    <stop offset="0" stop-color="#c9a876" stop-opacity="0.22"/>
    <stop offset="0.55" stop-color="#c9a876" stop-opacity="0.05"/>
    <stop offset="1" stop-color="#c9a876" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="o-floor" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#000" stop-opacity="0.62"/>
    <stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="o-gold" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6d5836"/><stop offset="0.18" stop-color="#c9a876"/>
    <stop offset="0.42" stop-color="#f0dcb8"/><stop offset="0.66" stop-color="#c9a876"/>
    <stop offset="1" stop-color="#7a6440"/>
  </linearGradient>
  <linearGradient id="o-steel" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4a4a4d"/><stop offset="0.2" stop-color="#b9bcc2"/>
    <stop offset="0.45" stop-color="#eef1f5"/><stop offset="0.7" stop-color="#9a9ea6"/>
    <stop offset="1" stop-color="#4d4d51"/>
  </linearGradient>
</defs>
<rect width="900" height="1200" fill="url(#o-bg)"/>
<rect width="900" height="1200" fill="url(#o-glow)"/>

<defs>
  <linearGradient id="o-glass" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3a2a14"/><stop offset="0.14" stop-color="#8a5f24"/>
    <stop offset="0.34" stop-color="#e0a83f"/><stop offset="0.5" stop-color="#f6d089"/>
    <stop offset="0.68" stop-color="#d99b34"/><stop offset="0.88" stop-color="#7d5620"/>
    <stop offset="1" stop-color="#31240f"/>
  </linearGradient>
  <linearGradient id="o-oil" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f3c477" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#8a5a19" stop-opacity="0.55"/>
  </linearGradient>
</defs>
<ellipse cx="450" cy="1035" rx="250" ry="30" fill="url(#o-floor)"/>

