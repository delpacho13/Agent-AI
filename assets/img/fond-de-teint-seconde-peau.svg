    <stop offset="0.45" stop-color="#eef1f5"/><stop offset="0.7" stop-color="#9a9ea6"/>
    <stop offset="1" stop-color="#4d4d51"/>
  </linearGradient>
</defs>
<rect width="900" height="1200" fill="url(#f-bg)"/>
<rect width="900" height="1200" fill="url(#f-glow)"/>

<defs>
