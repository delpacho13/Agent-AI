    <stop offset="0" stop-color="#e8c9a6"/><stop offset="1" stop-color="#b98d63"/>
  </linearGradient>
</defs>
<ellipse cx="450" cy="1032" rx="245" ry="30" fill="url(#f-floor)"/>

