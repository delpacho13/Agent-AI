<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1200" width="960" height="1200" role="img">
<defs>
  <linearGradient id="a-bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#efe8db"/><stop offset="1" stop-color="#ddd3c2"/>
  </linearGradient>
  <radialGradient id="a-light" cx="30%" cy="16%" r="70%">
    <stop offset="0" stop-color="#fffdf8" stop-opacity="0.95"/>
    <stop offset="1" stop-color="#fffdf8" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="a-gold" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#a3854f"/><stop offset="0.35" stop-color="#e2c691"/>
    <stop offset="0.6" stop-color="#c9a876"/><stop offset="1" stop-color="#8f7444"/>
  </linearGradient>
  <linearGradient id="a-jar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#c9bfae"/><stop offset="0.25" stop-color="#f6f1e7"/>
    <stop offset="0.6" stop-color="#e2dacb"/><stop offset="1" stop-color="#b8ae9c"/>
  </linearGradient>
  <linearGradient id="a-amber" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8a5f24"/><stop offset="0.35" stop-color="#e0a83f"/>
    <stop offset="0.62" stop-color="#c98c2c"/><stop offset="1" stop-color="#6d4a1b"/>
  </linearGradient>
</defs>
<rect width="960" height="1200" fill="url(#a-bg)"/>
<rect width="960" height="1200" fill="url(#a-light)"/>
<!-- plan de travail en pierre -->
<rect x="0" y="880" width="960" height="320" fill="#cdc2b1"/>
